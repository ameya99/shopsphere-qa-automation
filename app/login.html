<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            color: #4f46e5;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7b8495;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d7dbe5;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button {
            border: none;
            background: #4f46e5;
            color: white;
        }

        .cancel-button {
            margin-top: 10px;
            border: 1px solid #d7dbe5;
            background: white;
        }

        #login-message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="login-card">

            <a href="index.html" class="logo">
             ◈ ShopSphere
            </a>


            <h1>Login</h1>

            <p class="subtitle">
                Login to continue with your order.
            </p>

            <form id="login-form">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    data-testid="login-email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    data-testid="login-password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="login-button"
                    data-testid="login-button">
                    Login & Continue
                </button>

            </form>

            <button
                class="cancel-button"
                data-testid="cancel-login"
                onclick="window.location.href='cart.html'">
                Cancel
            </button>

            <button
            class="cancel-button"
            data-testid="signup-link"
            onclick="window.location.href='signup.html'">
            New user? Sign Up
            </button>


            <div id="login-message"></div>

        </div>

    </div>

<script>

    if (
        sessionStorage.getItem('shopsphereCheckoutPending') === 'true' &&
        localStorage.getItem('shopsphereLoggedIn') === 'true'
    ) {
        sessionStorage.removeItem('shopsphereCheckoutPending');
        window.location.href = 'checkout.html';
    }

    document
        .getElementById('login-form')
        .addEventListener('submit', function(event) {

            event.preventDefault();

            const email = document
                .getElementById('email')
                .value
                .trim()
                .toLowerCase();

            const password = document
                .getElementById('password')
                .value;

            const message = document.getElementById(
                'login-message'
            );

            const storedUser = localStorage.getItem(
                'shopsphereUser'
            );

            if (!storedUser) {

                message.textContent =
                    'No account found. Please sign up first.';

                message.style.color = '#dc2626';

                return;
            }

            const user = JSON.parse(storedUser);

            if (
                user.email !== email ||
                user.password !== password
            ) {

                message.textContent =
                    'Invalid email or password.';

                message.style.color = '#dc2626';

                return;
            }

            localStorage.setItem(
                'shopsphereLoggedIn',
                'true'
            );

            message.textContent =
                'Login successful!';

            message.style.color = '#16a34a';

            setTimeout(function() {
                window.location.href = 'checkout.html';
            }, 500);

        });

</script>

    


    




</body>

</html>
