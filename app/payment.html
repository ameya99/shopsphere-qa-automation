<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .payment-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            color: #4f46e5;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7b8495;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d7dbe5;
            border-radius: 8px;
            font-size: 14px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .pay-button {
            border: none;
            background: #4f46e5;
            color: white;
            margin-top: 5px;
        }

        .cancel-button {
            margin-top: 10px;
            border: 1px solid #d7dbe5;
            background: white;
        }

        .test-card {
            background: #f5f7ff;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            color: #4b5563;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="payment-card">

        <div class="logo">
            ◈ ShopSphere
        </div>

        <h1>
            Payment
        </h1>

        <p class="subtitle">
            Complete your order using our test payment gateway.
        </p>

        <div class="test-card">

            <strong>Test Card</strong><br>

            Card: 4111 1111 1111 1111<br>
            Expiry: 12/30<br>
            CVV: 123

        </div>

        <form id="payment-form">

            <label for="card-number">
                Card Number
            </label>

            <input
                id="card-number"
                data-testid="card-number"
                type="text"
                inputmode="numeric"
                autocomplete="cc-number"
                placeholder="4111 1111 1111 1111"
                maxlength="19"
                required
            >

            <div class="row">

                <div>

                    <label for="expiry">
                        Expiry
                    </label>

                    <input
                        id="expiry"
                        data-testid="card-expiry"
                        type="text"
                        inputmode="numeric"
                        autocomplete="cc-exp"
                        placeholder="MM/YY"
                        maxlength="5"
                        required
                    >

                </div>

                <div>

                    <label for="cvv">
                        CVV
                    </label>

                    <input
                        id="cvv"
                        data-testid="card-cvv"
                        type="password"
                        inputmode="numeric"
                        autocomplete="cc-csc"
                        placeholder="123"
                        maxlength="3"
                        required
                    >

                </div>

            </div>

            <button
                type="submit"
                class="pay-button"
                data-testid="pay-now">

                Pay Now

            </button>

        </form>

        <button
            class="cancel-button"
            data-testid="cancel-payment"
            onclick="window.location.href='checkout.html'">

            Cancel

        </button>

    </div>

</div>


<script>

    // Payment must not be directly accessible without authentication.
    if (localStorage.getItem('shopsphereLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }


    document
        .getElementById('payment-form')
        .addEventListener('submit', function(event) {

            event.preventDefault();


            // Re-check authentication before processing payment.
            if (localStorage.getItem('shopsphereLoggedIn') !== 'true') {
                window.location.href = 'login.html';
                return;
            }


            const cardNumber =
                document.getElementById('card-number').value.trim();

            const expiry =
                document.getElementById('expiry').value.trim();

            const cvv =
                document.getElementById('cvv').value.trim();


            // Remove spaces from the card number before validation.
            const normalizedCardNumber =
                cardNumber.replace(/\s/g, '');


            // Card number must contain exactly 16 digits.
            if (!/^\d{16}$/.test(normalizedCardNumber)) {
                alert('Card number must contain exactly 16 digits.');
                return;
            }


            // Expiry must use MM/YY format.
            if (!/^\d{2}\/\d{2}$/.test(expiry)) {
                alert('Expiry must be in MM/YY format.');
                return;
            }


            const expiryParts =
                expiry.split('/');

            const expiryMonth =
                Number(expiryParts[0]);

            const expiryYear =
                Number(expiryParts[1]);


            // Month must be between 01 and 12.
            if (expiryMonth < 1 || expiryMonth > 12) {
                alert('Expiry month must be between 01 and 12.');
                return;
            }


            // Compare the expiry date against the current month.
            const currentDate =
                new Date();

            const currentMonth =
                currentDate.getMonth() + 1;

            const currentYear =
                currentDate.getFullYear() % 100;


            if (
                expiryYear < currentYear ||
                (
                    expiryYear === currentYear &&
                    expiryMonth < currentMonth
                )
            ) {
                alert('The card expiry date has passed.');
                return;
            }


            // CVV must contain exactly 3 digits.
            if (!/^\d{3}$/.test(cvv)) {
                alert('CVV must contain exactly 3 digits.');
                return;
            }


            // Mark payment as successfully completed.
            localStorage.setItem(
                'shopspherePaymentCompleted',
                'true'
            );


            // Continue to the protected confirmation page.
            window.location.href =
                'order-confirmation.html';

        });

</script>

</body>
</html>
