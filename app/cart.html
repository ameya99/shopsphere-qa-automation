<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Cart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .header {
            max-width: 1152px;
            height: 72px;
            margin: auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #4f46e5;
        }

        .back-link {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 30px;
        }

        .cart-card {
            background: white;
            border: 1px solid #e6e8ee;
            border-radius: 15px;
            padding: 25px;
        }

        .cart-item {
            display: grid;
        grid-template-columns: minmax(0, 1fr) 120px 130px 70px;
        gap: 20px;
        align-items: center;
        padding: 20px 0;
        border-bottom: 1px solid #eee;
        }

        .product-info h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .product-info p {
            color: #7b8495;
            font-size: 13px;
        }

        .quantity {
            font-weight: 600;
        }

        .price {
            font-weight: 800;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 20px;
            font-weight: 800;
        }

        .checkout-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #4f46e5;
            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        .checkout-button:hover {
            background: #4338ca;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
            color: #7b8495;
        }

        .quantity-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.quantity-button {
    width: 30px;
    height: 30px;
    border: 1px solid #d7dbe5;
    background: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
}

.quantity-button:hover {
    background: #eef2ff;
}

.quantity-value {
    min-width: 25px;
    text-align: center;
    font-weight: 700;
}

.remove-button {
    border: none;
    background: transparent;
    color: #dc2626;
    font-weight: 600;
    cursor: pointer;
}

.remove-button:hover {
    text-decoration: underline;
}

.cart-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
}

.clear-button {
    border: 1px solid #dc2626;
    background: white;
    color: #dc2626;
    padding: 9px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}




    </style>
</head>

<body>

    <header>

        <div class="header">

            <div class="logo">
                ◈ ShopSphere
            </div>

            <a
                href="index.html"
                class="back-link">
                ← Continue Shopping
            </a>

        </div>

    </header>


    <main>

        <div class="container">

            <h1>
                Your Shopping Cart
            </h1>

            <div class="cart-card">

                <div id="cart-items">
            </div>

            <div
    id="cart-actions"
    class="cart-actions"
    style="display:none;"
>
    <button
        class="clear-button"
        data-testid="clear-cart"
        onclick="clearCart()"
    >
        Clear Cart
    </button>
</div>


                <div class="summary">

                    <span>
                        Total
                    </span>

                    <span id="cart-total">
            ₹0
        </span>

                </div>


                <button
                    class="checkout-button"
                    data-testid="proceed-to-checkout"
                    onclick="window.location.href='login.html'">
                    
                    Proceed to Checkout →

                </button>

            </div>

        </div>

    </main>

<script>

    let cart =
        JSON.parse(localStorage.getItem('shopsphereCart')) || [];

    const cartItems =
        document.getElementById('cart-items');

    const cartTotal =
        document.getElementById('cart-total');

    const cartActions =
        document.getElementById('cart-actions');


    function saveCart() {

        localStorage.setItem(
            'shopsphereCart',
            JSON.stringify(cart)
        );

    }


    function renderCart() {

        cartItems.innerHTML = '';

        let total = 0;


        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty-cart">
                    Your cart is empty.
                </div>
            `;

            cartActions.style.display = 'none';

        } else {

            cartActions.style.display = 'flex';


            cart.forEach((product, index) => {

                const quantity =
                    product.quantity || 1;

                const itemTotal =
                    product.price * quantity;

                total = total + itemTotal;


                cartItems.innerHTML += `
                    <div
                        class="cart-item"
                        data-testid="cart-item"
                    >

                        <div class="product-info">

                            <h3>
                                ${product.name}
                            </h3>

                            <p>
                                ₹${product.price.toLocaleString('en-IN')}
                                each
                            </p>

                        </div>


                        <div class="quantity-controls">

                            <button
                                class="quantity-button"
                                data-testid="decrease-quantity"
                                aria-label="Decrease quantity"
                                onclick="decreaseQuantity(${index})"
                            >
                                −
                            </button>

                            <span
                                class="quantity-value"
                                data-testid="quantity"
                            >
                                ${quantity}
                            </span>

                            <button
                                class="quantity-button"
                                data-testid="increase-quantity"
                                aria-label="Increase quantity"
                                onclick="increaseQuantity(${index})"
                            >
                                +
                            </button>

                        </div>


                        <div
                            class="price"
                            data-testid="item-total"
                        >
                            ₹${itemTotal.toLocaleString('en-IN')}
                        </div>


                        <button
                            class="remove-button"
                            data-testid="remove-item"
                            onclick="removeItem(${index})"
                        >
                            Remove
                        </button>

                    </div>
                `;

            });

        }


        cartTotal.textContent =
            `₹${total.toLocaleString('en-IN')}`;

    }


    function increaseQuantity(index) {

        cart[index].quantity =
            (cart[index].quantity || 1) + 1;

        saveCart();

        renderCart();

    }


    function decreaseQuantity(index) {

        cart[index].quantity =
            (cart[index].quantity || 1) - 1;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        saveCart();

        renderCart();

    }


    function removeItem(index) {

        cart.splice(index, 1);

        saveCart();

        renderCart();

    }


    function clearCart() {

        cart = [];

        saveCart();

        renderCart();

    }


    renderCart();



</script>
</body>

</html>
