<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Order Confirmed</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirmation-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        .success-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .logo {
            color: #4f46e5;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .message {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .order-number {
            background: #f5f7ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .order-number strong {
            display: block;
            margin-top: 5px;
            font-size: 18px;
        }

        .home-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="confirmation-card">

        <div class="logo">
            ◈ ShopSphere
        </div>

        <div class="success-icon">
            ✅
        </div>

        <h1>
            Order Confirmed!
        </h1>

        <p class="message">
            Thank you for shopping with ShopSphere.
            Your payment was successful and your order
            has been placed.
        </p>

        <div class="order-number">

            Order Number

            <strong id="order-number">
                SS-2026-1001
            </strong>

        </div>

        <button
            class="home-button"
            data-testid="continue-shopping"
            onclick="window.location.href='index.html'">

            Continue Shopping

        </button>

    </div>

</div>

<script>

    // Confirmation is only valid after a successful payment.
    if (
        localStorage.getItem('shopspherePaymentCompleted') !== 'true'
    ) {
        window.location.href = 'login.html';
    } else {

        // Clear the cart after successful payment.
        localStorage.removeItem('shopsphereCart');

        // Consume the payment-success state so the confirmation
        // cannot be reused as proof of another completed payment.
        localStorage.removeItem('shopspherePaymentCompleted');
    }

</script>

</body>

</html>
