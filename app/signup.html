<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-card {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            color: #4f46e5;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7b8495;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d7dbe5;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .signup-button {
            border: none;
            background: #4f46e5;
            color: white;
        }

        .login-button {
            margin-top: 10px;
            border: 1px solid #d7dbe5;
            background: white;
        }

        #signup-message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="signup-card">

            <div class="logo">
                ◈ ShopSphere
            </div>

            <h1>Sign Up</h1>

            <p class="subtitle">
                Create your ShopSphere account.
            </p>

            <form id="signup-form">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    data-testid="signup-email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    data-testid="signup-password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    class="signup-button"
                    data-testid="signup-button">
                    Create Account
                </button>

            </form>

            <button
                class="login-button"
                data-testid="go-to-login"
                onclick="window.location.href='login.html'">
                Already have an account? Login
            </button>

            <div id="signup-message"></div>

        </div>

    </div>

    <script>

        document
            .getElementById('signup-form')
            .addEventListener('submit', function(event) {

                event.preventDefault();

                const email = document
                    .getElementById('email')
                    .value
                    .trim()
                    .toLowerCase();

                const password = document
                    .getElementById('password')
                    .value;

                const existingUser = localStorage.getItem(
                    'shopsphereUser'
                );

                if (existingUser) {

                    const user = JSON.parse(existingUser);

                    if (user.email === email) {

                        document.getElementById(
                            'signup-message'
                        ).textContent =
                            'An account with this email already exists.';

                        document.getElementById(
                            'signup-message'
                        ).style.color = '#dc2626';

                        return;
                    }
                }

                const user = {
                    email: email,
                    password: password
                };

                localStorage.setItem(
                    'shopsphereUser',
                    JSON.stringify(user)
                );

                document.getElementById(
                    'signup-message'
                ).textContent =
                    'Account created successfully! You can now login.';

                document.getElementById(
                    'signup-message'
                ).style.color = '#16a34a';

                document
                    .getElementById('signup-form')
                    .reset();

            });

    </script>

</body>

</html>
